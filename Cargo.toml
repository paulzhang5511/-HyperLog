[package]
name = "hyper-log"
version = "0.0.1"
edition = "2024"

[dependencies]
# GUI framework
egui = "0.36.1"
# 同时启用 glow 与 wgpu：默认用 glow（OpenGL，兼容性最好），
# wgpu 在部分 macOS 机型上会因 Metal 着色器编译失败而无法启动，
# 可通过环境变量 HYPER_LOG_RENDERER=wgpu 显式切换。
eframe = { version = "0.36.1", features = ["default", "glow"] }

# High-performance I/O and concurrent computation
memmap2 = "0.9"
rayon = "1.10"
regex = "1.10"
crossbeam-channel = "0.5.16"
# 字节级 SIMD 检索 / 行偏移并行扫描（P1/P8 性能验收，spec §11.2）
memchr = "2.7"

# Filesystem and dialog interaction
rfd = "0.15"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"

# 时间格式化：导出默认文件名需要本地日历时间戳（spec T17）
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
